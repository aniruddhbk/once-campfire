# 🐳 DOCKER COMPOSE FOR E2E TESTING
# Orchestrates all services needed for testing
#
# Usage:
#   docker-compose -f docker-compose.test.yml up --build
#   docker-compose -f docker-compose.test.yml run --rm tests npm run test:essential
#   docker-compose -f docker-compose.test.yml down

version: '3.8'

services:
  # Redis service for ActionCable
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - campfire-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rails application
  app:
    build:
      context: .
      dockerfile: Dockerfile.testing
    environment:
      - RAILS_ENV=test
      - NODE_ENV=test
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=sqlite3:db/test.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - campfire-test
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.bundle
      - test-results:/app/test-results
      - playwright-report:/app/playwright-report
    command: bundle exec rails server -e test -p 3000 -b 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

  # E2E Tests runner
  tests:
    build:
      context: .
      dockerfile: Dockerfile.testing
    environment:
      - RAILS_ENV=test
      - NODE_ENV=test
      - BASE_URL=http://app:3000
      - CI=true
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campfire-test
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.bundle
      - test-results:/app/test-results
      - playwright-report:/app/playwright-report
    command: npm test

  # Standalone test runner for quick runs
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.testing
    environment:
      - RAILS_ENV=test
      - BASE_URL=http://app:3000
    depends_on:
      - app
      - redis
    networks:
      - campfire-test
    volumes:
      - .:/app
      - /app/node_modules
      - test-results:/app/test-results
      - playwright-report:/app/playwright-report
    profiles:
      - manual
    entrypoint: ["npm", "run"]

networks:
  campfire-test:
    driver: bridge

volumes:
  test-results:
  playwright-report:
